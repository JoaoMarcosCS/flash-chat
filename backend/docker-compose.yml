x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
    args:
      API_PORT: ${API_PORT}
      NODE_VERSION: ${NODE_VERSION}

  image: flash-chat-backend

  restart: unless-stopped

  env_file:
    - .env

  environment:
    DB_HOST: postgres
    REDIS_HOST: redis
    RABBITMQ_HOST: rabbitmq

  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: flash-chat-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "127.0.0.1:${DB_PORT}:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flash-chat-redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"

    volumes:
      - redisdata:/data

    # Habilita persistência AOF para manter dados em reinícios
    command: ["redis-server", "--appendonly", "yes"]

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: flash-chat-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}

    ports:
      - "127.0.0.1:${RABBITMQ_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT}:15672"

    volumes:
      - rabbitmqdata:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  api:
    <<: *backend
    container_name: flash-chat-api

    ports:
      - "127.0.0.1:${API_PORT}:${API_PORT}"

  ws:
    <<: *backend
    container_name: flash-chat-ws
    command: ["node", "dist/infra/ws/server.js"]

    ports:
      - "127.0.0.1:${WS_PORT}:${WS_PORT}"

  persist-consumer:
    <<: *backend
    container_name: flash-chat-persist-consumer
    command: ["node", "dist/infra/persist-consumer/server.js"]

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
