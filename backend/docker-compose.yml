x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
    args:
      API_PORT: ${API_PORT}
      NODE_VERSION: ${NODE_VERSION}

  image: flash-chat-backend

  restart: unless-stopped

  env_file:
    - .env

  environment:
    DB_HOST: postgres
    REDIS_HOST: redis
    RABBITMQ_HOST: rabbitmq

  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: flash-chat-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "127.0.0.1:${DB_PORT}:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flash-chat-redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"

    volumes:
      - redisdata:/data

    # Habilita persistência AOF para manter dados em reinícios
    command: ["redis-server", "--appendonly", "yes"]

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: flash-chat-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}

    ports:
      - "127.0.0.1:${RABBITMQ_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT}:15672"

    volumes:
      - rabbitmqdata:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  api:
    <<: *backend
    container_name: flash-chat-api

    ports:
      - "127.0.0.1:${API_PORT}:${API_PORT}"

    labels:
      traefik.enable: 'true'
      traefik.http.routers.api.rule: 'Host(`flash-chat-backend.duckdns.org`)'
      traefik.http.routers.api.entrypoints: 'websecure'
      traefik.http.routers.api.tls.certresolver: 'letsencrypt'
      traefik.http.routers.api.middlewares: 'security-headers@file'
      traefik.http.routers.api.service: 'api'
      traefik.http.services.api.loadbalancer.server.port: '${API_PORT}'

  ws:
    <<: *backend
    container_name: flash-chat-ws
    command: ["node", "dist/infra/ws/server.js"]

    ports:
      - "127.0.0.1:${WS_PORT}:${WS_PORT}"

    labels:
      traefik.enable: 'true'
      traefik.http.routers.ws.rule: 'Host(`flash-chat-backend.duckdns.org`) && Path(`/ws`)'
      traefik.http.routers.ws.entrypoints: 'websecure'
      traefik.http.routers.ws.tls.certresolver: 'letsencrypt'
      traefik.http.routers.ws.middlewares: 'security-headers@file'
      traefik.http.routers.ws.service: 'ws'
      traefik.http.services.ws.loadbalancer.server.port: '${WS_PORT}'

  persist-consumer:
    <<: *backend
    container_name: flash-chat-persist-consumer
    command: ["node", "dist/infra/persist-consumer/server.js"]

  traefik:
    image: traefik:v3.7
    container_name: flash-chat-traefik
    restart: unless-stopped

    command:
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--providers.file.filename=/etc/traefik/traefik_dynamic.yml'
      - '--log.level=INFO'
      - '--log.format=json'
      - '--accesslog=true'
      - '--accesslog.format=json'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
      - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
      - '--entrypoints.websecure.address=:443'
      - '--certificatesresolvers.letsencrypt.acme.tlschallenge=true'
      - '--certificatesresolvers.letsencrypt.acme.email=jmcsjoaomarcos@gmail.com'
      - '--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json'

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik_dynamic.yml:/etc/traefik/traefik_dynamic.yml:ro
      - letsencrypt:/letsencrypt

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  letsencrypt:
