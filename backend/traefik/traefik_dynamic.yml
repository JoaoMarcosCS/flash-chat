http:
  middlewares:
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        customResponseHeaders:
          X-Frame-Options: 'DENY'
          X-Content-Type-Options: 'nosniff'
          Referrer-Policy: 'strict-origin-when-cross-origin'
          Permissions-Policy: 'geolocation=(), microphone=(), camera=()'
